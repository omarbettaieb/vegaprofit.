services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vegaprofit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vegaprofit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegaprofit"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Local dev only: expose Postgres on localhost. Remove in production.
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vegaprofit:${POSTGRES_PASSWORD}@db:5432/vegaprofit
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
